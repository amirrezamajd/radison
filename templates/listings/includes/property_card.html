<button type="button" class="property-card" data-property-id="{{ listing.id }}">
  {% with cover=listing.images.first %}
    {% if cover %}
      <img src="{{ cover.image.url }}" alt="{{ listing.title }}" loading="lazy">
    {% else %}
      <div class="property-card-empty" aria-hidden="true">
        <span>بدون تصویر</span>
      </div>
    {% endif %}
  {% endwith %}
  <div class="property-meta">
    {% if listing.deal_type or listing.virtual_tour %}
      <div class="chip-row property-card-chips">
        {% if listing.deal_type %}<span class="chip">{{ listing.deal_type }}</span>{% endif %}
        {% if listing.virtual_tour %}<span class="chip chip-tour">بازدید مجازی</span>{% endif %}
      </div>
    {% endif %}
    <h3>{{ listing.title }}</h3>
    <div class="price">{{ listing.price_text|default:"قیمت توافقی" }}</div>
  </div>
</button>
