{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}املاک رادیسون | سرخرود مازندران{% endblock %}</title>
  <meta name="description" content="کارگزاری املاک رادیسون در سرخرود مازندران؛ سرمایه‌گذاری، خرید و فروش ویلا و زمین در نوار ساحلی خزر بین محمودآباد و فریدون‌کنار.">
  <link rel="icon" href="{% static 'img/logo-r.png' %}?v=3" type="image/png" sizes="any">
  <link rel="shortcut icon" href="{% static 'img/logo-r.png' %}?v=3" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'img/logo-r.png' %}?v=3">
  <link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
